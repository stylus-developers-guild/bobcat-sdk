[package]
name = "bobcat-features"
version = "0.9.3"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for feature flagged release on Arbitrum Stylus."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_features"

[dependencies]
bobcat-call = { version = "0.9.3", path = "../bobcat-call", default-features = false }
bobcat-entry = { version = "0.9.3", path = "../bobcat-entry", default-features = false }
bobcat-interfaces = { version = "0.9.3", path = "../bobcat-interfaces", default-features = false }
bobcat-storage = { version = "0.9.3", path = "../bobcat-storage", default-features = false }
paste.workspace = true
bobcat-host = { version = "0.9.3", path = "../bobcat-host", default-features = false }

[features]
default = ["std"]
std = ["bobcat-storage/std", "bobcat-entry/std", "bobcat-host/std"]
mutex = ["bobcat-storage/mutex"]
alloy-enabled = ["bobcat-entry/alloy-enabled", "bobcat-storage/alloy-enabled"]
dont-define-symbols = ["bobcat-entry/dont-define-symbols"]
msg-on-sdk-err = ["bobcat-call/msg-on-sdk-err"]
panic = ["bobcat-call/panic"]
panic-rever = ["bobcat-call/panic-revert"]
