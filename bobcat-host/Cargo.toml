[package]
name = "bobcat-host"
version = "0.7.25"
edition = "2024"
license = "MIT"
description = "Functions for interacting with the host with bobcat-sdk"
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[dependencies]
num_enum = { version = "0.7.5", default-features = false }
keccak-const.workspace = true
const-hex.workspace = true

[features]
std = ["const-hex/std"]
mutex = ["std"]
console = []
