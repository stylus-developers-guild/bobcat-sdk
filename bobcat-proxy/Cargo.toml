[package]
name = "bobcat-proxy"
version = "0.9.6"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for creating proxy code on Arbitrum Stylus."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_proxy"

[dependencies]
array-concat = { workspace = true }
const-hex = { workspace = true }
bobcat-maths = { version = "0.9.6", path = "../bobcat-maths", default-features = false }
bobcat-interfaces = { version = "0.9.6", path = "../bobcat-interfaces", default-features = false }
