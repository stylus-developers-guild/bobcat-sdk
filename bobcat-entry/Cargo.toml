[package]
name = "bobcat-entry"
version = "0.9.6"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for building contract entrypoints on Arbitrum Stylus."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_entry"

[features]
default = ["std"]
alloc = ["const-hex/alloc"]
std = ["alloc", "bobcat-maths/std", "bobcat-storage/std"]
dont-define-symbols = []
alloy-enabled = ["bobcat-maths/alloy-enabled"]

[dependencies]
bobcat-cd = { version = "0.9.6", path = "../bobcat-cd", default-features = false }
bobcat-host = { version = "0.9.6", path = "../bobcat-host", default-features = false }
bobcat-maths = { version = "0.9.6", path = "../bobcat-maths", default-features = false }
bobcat-storage = { version = "0.9.6", path = "../bobcat-storage", default-features = false }
const-hex = { workspace = true }
