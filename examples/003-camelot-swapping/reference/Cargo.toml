[workspace]

[package]
name = "reference"
version = "0.1.11"
edition = "2024"

[dependencies]
alloy-sol-types = { version = "1.7.3", default-features = false }
stylus-sdk = "0.10.9"

[[bin]]
name = "reference"
path = "src/main.rs"

[lib]
name = "libreference"
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"

[features]
export-abi = []
contract-client-gen = []
