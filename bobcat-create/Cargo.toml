[package]
name = "bobcat-create"
version = "0.7.20"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for using CREATE1 and CREATE2 on Arbitrum Stylus."
homepage = "https://bobcat.so"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_create"

[dependencies]
bobcat-proxy = { version = "0.7.20", path = "../bobcat-proxy" }
bobcat-maths = { version = "0.7.20", path = "../bobcat-maths" }
bobcat-storage = { version = "0.7.20", path = "../bobcat-storage" }
array-concat.workspace = true
bobcat-host = { version = "0.7.20", path = "../bobcat-host" }

[features]
alloc = []
std = ["alloc"]
