[package]
name = "bobcat-interfaces"
version = "0.9.2"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for generating signautres  on Arbitrum Stylus."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[features]
default = ["alloc"]
alloc = []

[lib]
name = "bobcat_interfaces"

[dependencies]
array-concat.workspace = true
bobcat-cd = { version = "0.9.2", path = "../bobcat-cd", default-features = false }
bobcat-maths = { version = "0.9.2", path = "../bobcat-maths", default-features = false }
bobcat-storage = { version = "0.9.2", path = "../bobcat-storage", default-features = false }
const-hex.workspace = true

[dev-dependencies]
alloy-sol-macro = "1.4.1"
proptest.workspace = true
bobcat-maths = { version = "0.9.2", path = "../bobcat-maths", features = ["proptest"] }
alloy-primitives = "1.4.1"
alloy-sol-types = "1.4.1"
