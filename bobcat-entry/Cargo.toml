[package]
name = "bobcat-entry"
version = "0.7.12"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for building contract entrypoints on Arbitrum Stylus."
homepage = "https://bobcat.so"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_entry"

[features]
alloc = ["const-hex/alloc"]
std = ["alloc"]
dont-define-symbols = []
alloy-enabled = ["bobcat-maths/alloy-enabled"]

[dependencies]
bobcat-cd = { version = "0.7.12", path = "../bobcat-cd" }
bobcat-maths = { version = "0.7.12", path = "../bobcat-maths" }
const-hex = { workspace = true }
