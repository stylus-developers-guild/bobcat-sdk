[package]
name = "bobcat-events"
version = "0.11.0"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities performing event emission on Arbitrum Stylus."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[package.metadata.docs.rs]
all-features = true

[dependencies]
array-concat.workspace = true
bobcat-maths = { version = "0.11.0", path = "../bobcat-maths", default-features = false }
bobcat-host = { version = "0.11.0", path = "../bobcat-host", default-features = false }

[features]
alloc = ["bobcat-maths/alloc"]
shadow = []
