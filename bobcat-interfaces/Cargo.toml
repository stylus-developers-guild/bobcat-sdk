[package]
name = "bobcat-interfaces"
version = "0.7.13"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for generating signautres  on Arbitrum Stylus."
homepage = "https://bobcat.so"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_interfaces"

[dependencies]
array-concat.workspace = true
bobcat-cd = { version = "0.7.13", path = "../bobcat-cd" }
bobcat-maths = { version = "0.7.13", path = "../bobcat-maths" }
bobcat-storage = { version = "0.7.13", path = "../bobcat-storage" }
const-hex.workspace = true

[dev-dependencies]
alloy-sol-macro = "1.4.1"
proptest.workspace = true
bobcat-maths = { version = "0.7.13", path = "../bobcat-maths", features = ["proptest"] }
alloy-primitives = "1.4.1"
alloy-sol-types = "1.4.1"
