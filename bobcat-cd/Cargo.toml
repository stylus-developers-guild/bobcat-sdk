[package]
name = "bobcat-cd"
version = "0.10.0"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for accessing calldata on Arbitrum Stylus."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_cd"

[dependencies]
bobcat-cd-derive = { version = "0.10.0", path = "../bobcat-cd-derive", optional = true }
bobcat-maths = { version = "0.10.0", path = "../bobcat-maths", default-features = false }
array-concat = { workspace = true }
proptest = { workspace = true, optional = true }
bobcat-storage = { version = "0.10.0", path = "../bobcat-storage", default-features = false }
const-hex = { workspace = true }

[dev-dependencies]
bobcat-cd-derive = { version = "0.10.0", path = "../bobcat-cd-derive" }
alloy-primitives = { version = ">=1.0.0", default-features = false }
alloy-sol-types = { version = ">=1.0.0", default-features = false }

[features]
alloc = []
derive = ["dep:bobcat-cd-derive"]
proptest = ["dep:proptest", "alloc"]
std = ["alloc"]
