[package]
name = "bobcat-console"
version = "0.11.1"
edition = "2024"
license = "MIT"
description = "bobcat-sdk console makes printing easy with Arbitrum Stylus, using a macro."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[package.metadata.docs.rs]
all-features = true

[dependencies]
bobcat-host = { version = "0.11.1", path = "../bobcat-host", features = ["console"], default-features = false }
