[package]
name = "bobcat-maths-zone"
version = "0.7.35"
edition = "2024"
license = "MIT"
description = "bobcat-sdk DSL for math that makes checked math with drop-in Python code easy."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
proc-macro = true

[dependencies]
bobcat-maths = { version = "0.7.2", path = "../bobcat-maths", features = ["alloy-enabled"] }
bobcat-panic = { version = "0.7.2", path = "../bobcat-panic" }
proc-macro2 = "1.0.86"
quote = "1.0.37"
syn = { version = "2.0.75", features = ["full"] }
