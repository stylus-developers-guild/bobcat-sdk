[package]
name = "bobcat-storage"
version = "0.10.1"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for accessing storage on Arbitrum Stylus."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "bobcat_storage"

[dependencies]
bobcat-maths = { version = "0.10.1", path = "../bobcat-maths", default-features = false }
keccak-const.workspace = true
proptest = { workspace = true, optional = true }
array-concat = { workspace = true }
paste.workspace = true
bobcat-host = { version = "0.10.1", path = "../bobcat-host", default-features = false }

[dev-dependencies]
const-hex = { workspace = true }
proptest = { workspace = true }

[features]
std = ["bobcat-host/std"]
proptest = ["dep:proptest"]
mutex = []
alloy-enabled = ["bobcat-maths/alloy-enabled"]
