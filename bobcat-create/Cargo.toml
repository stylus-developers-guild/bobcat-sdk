[package]
name = "bobcat-create"
version = "0.9.2"
edition = "2024"
license = "MIT"
description = "bobcat-sdk utilities for using CREATE1 and CREATE2 on Arbitrum Stylus."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[lib]
name = "bobcat_create"

[dependencies]
bobcat-proxy = { version = "0.9.2", path = "../bobcat-proxy", default-features = false }
bobcat-maths = { version = "0.9.2", path = "../bobcat-maths", default-features = false }
bobcat-storage = { version = "0.9.2", path = "../bobcat-storage", default-features = false }
array-concat.workspace = true
bobcat-host = { version = "0.9.2", path = "../bobcat-host", default-features = false }

[features]
default = ["std"]
alloc = []
std = ["alloc"]
