[package]
name = "bobcat-cd-derive"
version = "0.10.4"
edition = "2024"
license = "MIT"
description = "Derive macros for bobcat-sdk EVM calldata types."
homepage = "https://stylusup.sh"
repository = "https://github.com/stylus-developers-guild/bobcat-sdk"

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
heck = "0.5"
# Computes entrypoint selectors at macro-expansion time (host side) so the
# keccak implementation is never pulled into a contract's wasm.
keccak-const.workspace = true

[dev-dependencies]
bobcat-cd = { path = "../bobcat-cd", features = ["std"] }
